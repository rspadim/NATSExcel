site_name: NATSExcel
site_description: Add-in do Excel (XLL) que traz o NATS para dentro do Excel via RTD e funções de planilha
site_url: https://rspadim.github.io/NATSExcel/
repo_url: https://github.com/rspadim/NATSExcel
repo_name: rspadim/NATSExcel
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  language: pt-BR
  logo: assets/logo-icon.svg
  favicon: assets/logo-icon.svg
  features:
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Mudar para o modo claro

plugins:
  - search:
      lang:
        - pt
        - en
        - es
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pt-BR
          default: true
          name: Português (Brasil)
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Início: Home
            Requisitos: Requirements
            Catálogo de funções: Function catalog
            Privacidade: Privacy
            Licença: License
        - locale: es
          name: Español
          build: true
          nav_translations:
            Início: Inicio
            Requisitos: Requisitos
            Catálogo de funções: Catálogo de funciones
            Privacidade: Privacidad
            Licença: Licencia

nav:
  - Início: index.md
  - Catálogo de funções: PUBLIC-SURFACE.md

extra_css:
  - assets/natsexcel.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

copyright: >-
  NATSExcel é um projeto independente e não é afiliado nem endossado pelo projeto
  NATS ou pela Synadia. Licença MIT.
