name: Build & Release NATSExcel

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

# Least privilege by default: the build job only reads the repository.
# Only the release job below may write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Golden rule 9: no private data in tracked files. A company name, a
      # company-owned domain or an internal host in a shipped doc or config is a
      # leak, so the gate fails the build on any hit. Only PRIVATE IPv4 ranges are
      # matched (each octet bounded, so "net10.0" or "V10.2" never matches), plus
      # internal-only TLDs; reserved documentation domains (example.com/or) and
      # localhost/127.0.0.1 are allowed. Add the project's own forbidden markers
      # (company name/domain) to the alternation below.
      - name: Private-data gate (golden rule 9)
        shell: pwsh
        run: |
          $ip = '(^|[^\d.])(10\.(\d{1,3})\.(\d{1,3})\.(\d{1,3})|172\.(1[6-9]|2\d|3[01])\.(\d{1,3})\.(\d{1,3})|192\.168\.(\d{1,3})\.(\d{1,3}))([^\d]|$)'
          $names = '[a-zA-Z0-9.-]+\.(local|internal|corp|lan|intranet)([^\w]|$)'
          $pattern = "$ip|$names"
          $hits = & git grep -n -I -E $pattern -- ':!installer/languages' 2>$null
          if ($LASTEXITCODE -eq 0 -and $hits) {
            Write-Host $hits
            throw "Private-data gate: a private IP or internal-only host is in a tracked file"
          }
          Write-Host "Private-data gate: clean"

      # Cache the NuGet package graph: every later step then restores from the
      # cache instead of the network. The key hashes the project files, so the
      # cache misses (and rebuilds) only when a dependency really changes.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Build the whole solution ONCE: the add-in (Excel-DNA packs the XLLs as
      # part of the build, and 'publish\' then holds both packed XLLs plus
      # NATSExcel.dll), the four test projects and the validator. Every test
      # step below then runs --no-build --no-restore against THIS output, so no
      # layer pays for a second restore or a second compile. Only on a 'v*' tag
      # is the release tag embedded as the InformationalVersion; a branch build
      # keeps the csproj default 'dev'.
      - name: Build the solution (Release)
        shell: pwsh
        run: |
          $tag = "dev"
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          dotnet build NATSExcel.sln -c Release "/p:InformationalVersion=$tag"

      # Unit tests do NOT retry: a failure is a real defect, not runner noise.
      # --no-build --no-restore reuses the solution build above (which already
      # compiled this project), so the step is restore-free and compile-free.
      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test test/NATSExcel.Tests/NATSExcel.Tests.csproj -c Release --no-build --no-restore

      # NATS runs natively on Windows as a single self-contained binary, so
      # there is no Memurai/Chocolatey-style service to install. The official
      # 'nats-server' Chocolatey package is stale (last published 2019), so the
      # pinned GitHub release zip is downloaded instead. The version and the
      # digest are both pinned (PLAN V10.2).
      #
      # Download ONLY here: a process started via Start-Process in one step is
      # killed when that step ends (the Windows runner runs each step in a job
      # object with kill-on-close), so the server must be started in the SAME
      # step as the tests that use it. The extracted path is handed over via
      # GITHUB_ENV.
      - name: Download the NATS server (JetStream enabled)
        shell: pwsh
        run: |
          $ver = '2.15.1'
          # Pinned SHA256 of the release zip: a compromised mirror or a MITM
          # cannot make CI run arbitrary code. Keep it in step with
          # installer\install-server.ps1.
          $sha = '4F7EDFA376750B2720463BD22766ED469A5F13F378A643097866FCD953CBF7E3'
          $url = "https://github.com/nats-io/nats-server/releases/download/v$ver/nats-server-v$ver-windows-amd64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "nats-server-$ver.zip"
          $dir = Join-Path $env:RUNNER_TEMP "nats-server"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($actual -ne $sha) { throw "nats-server zip checksum mismatch: expected $sha but got $actual" }
          Write-Host "nats-server zip checksum OK ($actual)"
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $exe = (Get-ChildItem $dir -Recurse -Filter 'nats-server.exe' | Select-Object -First 1).FullName
          if (-not $exe) { throw "nats-server.exe not found in $dir" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "nats-server --version failed (exit $LASTEXITCODE)" }
          "NATSEXCEL_NATS_SERVER=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "nats-server downloaded: $exe"

      # Start the server inside the test step (see the note above) and prove it
      # is up with a real handshake: open the wire port, read INFO, require
      # jetstream:true. The same helper is used locally.
      - name: Run smoke tests
        shell: pwsh
        run: |
          $urls = & powershell -NoProfile -ExecutionPolicy Bypass -File test/TestSupport/Start-Cluster.ps1 -Nodes 1 -ServerExe "$env:NATSEXCEL_NATS_SERVER" | Select-Object -Last 1
          $url = "$urls".Split(',')[0].Trim()
          if (-not $url) { $url = 'nats://127.0.0.1:4222' }
          Write-Host "smoke target: $url"
          $ok = $false
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Host "smoke attempt $attempt/2"
            dotnet run --project test/SmokeTests -c Release --no-build --no-restore -- "$url" --require-jetstream
            if ($LASTEXITCODE -eq 0) { Write-Host "smoke passed on attempt $attempt"; $ok = $true; break }
            Write-Host "smoke attempt $attempt failed (exit $LASTEXITCODE)"
            if ($attempt -lt 2) { Start-Sleep -Seconds 3 }
          }
          if (-not $ok) { throw "smoke tests failed on both attempts" }

      # A loaded/slow CI runner can stall the whole process for a moment (one
      # scheduling hiccup inflates the heartbeat, the delivery gap and the
      # chance of a transient error at once), which the liveness bounds rightly
      # flag. Retry before failing the job so infrastructure noise cannot block
      # a release; a real regression stalls every attempt. The server is started
      # here (a process started in an earlier step would be killed when that step
      # ended); --skip-restart skips only the destructive restart sub-phase.
      - name: Run liveness tests (quick)
        shell: pwsh
        run: |
          $urls = & powershell -NoProfile -ExecutionPolicy Bypass -File test/TestSupport/Start-Cluster.ps1 -Nodes 1 -ServerExe "$env:NATSEXCEL_NATS_SERVER" | Select-Object -Last 1
          $url = "$urls".Split(',')[0].Trim()
          if (-not $url) { $url = 'nats://127.0.0.1:4222' }
          Write-Host "liveness target: $url"
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "liveness attempt $attempt/3"
            dotnet run --project test/LivenessTests -c Release --no-build --no-restore -- "$url" --quick --skip-restart
            if ($LASTEXITCODE -eq 0) { Write-Host "liveness passed on attempt $attempt"; $ok = $true; break }
            Write-Host "liveness attempt $attempt failed (exit $LASTEXITCODE)"
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          if (-not $ok) { throw "liveness tests failed on all attempts" }

      # The load layer is a real assertion now: it FAILS below a conservative
      # throughput floor, so a regression in the broadcast path is visible. Own
      # server, same as the other layers.
      - name: Run load tests (manager + raw)
        shell: pwsh
        run: |
          $urls = & powershell -NoProfile -ExecutionPolicy Bypass -File test/TestSupport/Start-Cluster.ps1 -Nodes 1 -ServerExe "$env:NATSEXCEL_NATS_SERVER" | Select-Object -Last 1
          $url = "$urls".Split(',')[0].Trim()
          if (-not $url) { $url = 'nats://127.0.0.1:4222' }
          Write-Host "load target: $url"
          foreach ($mode in 'manager','raw') {
            Write-Host "load mode $mode"
            dotnet run --project test/LoadTests -c Release --no-build --no-restore -- $mode "$url" 8 2 1
            if ($LASTEXITCODE -ne 0) { throw "load test ($mode) failed (exit $LASTEXITCODE)" }
          }

      - name: Verify CHANGELOG matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # A release tag must name the finalized changelog section, otherwise
          # the repo would ship an "(unreleased)" heading. Anchor the match on the
          # exact heading so a short tag (v1.5) cannot pass against v1.5.0.
          $tag = "${{ github.ref_name }}"
          $heading = (Get-Content CHANGELOG.md | Where-Object { $_ -match '^##\s' } | Select-Object -First 1)
          if ("$heading" -notmatch ('^##\s+' + [regex]::Escape($tag) + '\s*$')) {
            throw "CHANGELOG.md top heading '$heading' does not match the tag '$tag'. Finalize the changelog (remove 'Unreleased') before tagging."
          }
          Write-Host "CHANGELOG heading matches the tag: $heading"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Build the installer on every run (so a broken .iss is caught here, not
      # only on a release tag). The version is the tag without the leading 'v'
      # (e.g. v1.0.0 -> NATSExcelSetup-1.0.0.exe), or "dev" on a branch.
      - name: Build the installer
        shell: pwsh
        run: |
          $ver = "dev"
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}".TrimStart('v') }
          iscc "/DAppVersion=$ver" "installer\NATSExcel.iss"
          $exe = "installer\output\NATSExcelSetup-$ver.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "installer was not produced: $exe" }
          Write-Host "installer built: $exe"

      - name: Upload the installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: natsexcel-installer
          path: installer/output/*.exe
          if-no-files-found: error

      # Fail loudly if ANY release asset is missing: if-no-files-found only fails
      # when the whole path set matches zero files, so one missing asset among the
      # set would otherwise upload a partial (broken) release.
      - name: Verify the release assets exist
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $assets = @(
            'bin/Release/net48/publish/NATSExcel.dll',
            'bin/Release/net48/publish/NATSExcel-packed.xll',
            'bin/Release/net48/publish/NATSExcel64-packed.xll',
            'NLog.config',
            'NATSExcel.json'
          )
          $missing = $assets | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing.Count -gt 0) {
            throw "release assets missing: " + ($missing -join ', ')
          }
          if ((Get-ChildItem 'installer/output/*.exe' -ErrorAction SilentlyContinue).Count -eq 0) {
            throw "release asset missing: installer/output/NATSExcelSetup-*.exe"
          }
          Write-Host ("release assets present: " + ($assets.Count + 1) + " files")

      # Hand the release assets to the release job. The artifact keeps the
      # paths relative to the repository root (bin/..., the two config files and
      # the installer), which the release job references below.
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            bin/Release/net48/publish/NATSExcel.dll
            bin/Release/net48/publish/NATSExcel-packed.xll
            bin/Release/net48/publish/NATSExcel64-packed.xll
            NLog.config
            NATSExcel.json
            installer/output/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # The release job needs the repository for CHANGELOG.md (the release body).
      # Checkout MUST run before the artifact download: its default clean would
      # otherwise wipe the downloaded release-assets directory.
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Extract the release notes from CHANGELOG.md
        shell: pwsh
        run: |
          # Use the section for this tag as the release body, so the published
          # release explains what shipped (the guard above already proved the
          # heading exists). The section runs from '## <tag>' up to the next '## '.
          $tag = "${{ github.ref_name }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern ('^##\s+' + [regex]::Escape($tag) + '\s*$') | Select-Object -First 1).LineNumber
          if (-not $start) { throw "no CHANGELOG section for $tag" }
          $end = ($lines | Select-String -Pattern '^##\s' | Where-Object { $_.LineNumber -gt $start } | Select-Object -First 1).LineNumber
          if (-not $end) { $end = $lines.Count + 1 }
          $body = $lines[($start)..($end - 2)] -join "`n"
          Set-Content -LiteralPath release-notes.md -Value $body -Encoding utf8
          Write-Host ("release notes: " + ($end - 1 - $start) + " lines")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Tags with a suffix (e.g. v1.0.0-rc1) publish as prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            release-assets/bin/Release/net48/publish/NATSExcel.dll
            release-assets/bin/Release/net48/publish/NATSExcel-packed.xll
            release-assets/bin/Release/net48/publish/NATSExcel64-packed.xll
            release-assets/NLog.config
            release-assets/NATSExcel.json
            release-assets/installer/output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
