name: Deploy landing page

# Publishes the static landing page in docs/ to GitHub Pages. This is separate
# from build.yml (the build/release pipeline) and never touches it.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege: the deploy job needs to publish to Pages, identify itself to
# the Pages service and read the repository contents.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; queued runs are not cancelled so a push
# never leaves the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
